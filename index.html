<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ATMOSPHERE — Aplikasi prakiraan cuaca otomatis, observasi meteorologi, dan prediksi suhu realtime." />
  <title>ATMOSPHERE</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen flex flex-col justify-between antialiased transition-colors duration-300">

  <!-- Header -->
  <header class="w-full border-b border-zinc-300 dark:border-zinc-800/80 py-4 px-4 bg-white/90 dark:bg-zinc-900/80 backdrop-blur-md sticky top-0 z-20 transition-colors">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      
      <!-- Branding -->
      <hgroup>
        <h1 class="font-display text-2xl font-bold text-blue-700 dark:text-blue-700">
          ATMOSPHERE
        </h1>
        <p class="text-[10px] text-black dark:text-white tracking-wider font-display hidden sm:block mt-0.5">
          Automated Temperature, Meteorological Observations & Sky Predictions
        </p>
      </hgroup>

      <!-- Controls (Theme di Kiri, Bahasa di Kanan) -->
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Tombol Theme -->
        <button 
          id="theme-toggle" 
          type="button"
          class="p-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-300 hover:text-blue-700 dark:hover:text-blue-700 transition cursor-pointer border border-zinc-300 dark:border-zinc-700/60 shadow-xs active:scale-95" 
          aria-label="Toggle Theme"
        >
          <span id="theme-icon" class="text-base leading-none">🌙</span>
        </button>

        <!-- Tombol Bahasa -->
        <button 
          id="lang-toggle-btn" 
          type="button"
          class="px-2.5 py-2.5 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-bold text-sm hover:border-blue-700 border border-zinc-300 dark:border-zinc-700/60 transition cursor-pointer shadow-xs active:scale-95"
          aria-label="Ganti Bahasa"
        >
          ID
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-1">
    <!-- Form Pencarian -->
    <form id="search-form" class="flex gap-2 mb-8" role="search">
      <label for="city-input" class="sr-only">Nama Kota</label>
      <input
        type="text"
        id="city-input"
        placeholder="Masukkan nama kota..."
        class="flex-1 bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition text-zinc-900 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-500 shadow-xs"
        required
      />
      <button
        type="submit"
        id="search-btn"
        class="bg-white hover:bg-blue-700 text-black hover:text-white font-semibold px-6 py-3 rounded-xl text-sm transition cursor-pointer shadow-xs border border-zinc-900"
      >
        Cari
      </button>
    </form>

    <!-- Container Weather Card -->
    <section id="weather-container" aria-live="polite"></section>
  </main>

  <!-- Footer -->
  <footer class="font-display py-4 text-center text-xs text-black dark:text-white border-t border-black dark:border-white">
    <p>© 2026 ATMOSPHERE. Created with HTML5, Tailwind CSS, & Vite.</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
